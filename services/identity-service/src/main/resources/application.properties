spring.application.name=identity-service
server.port=8081

spring.datasource.url=${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/sleepbench_identity}
spring.datasource.username=${IDENTITY_DB_USERNAME:postgres}
spring.datasource.password=${IDENTITY_DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false