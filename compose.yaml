services:
  identity-db:
    image: postgres:17-alpine
    container_name: sleepbench-identity-db
    environment:
      POSTGRES_DB: sleepbench_identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sleepbench_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
    identity-db-data: